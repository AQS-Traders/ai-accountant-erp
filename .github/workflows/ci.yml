name: CI

# Verifies every push and pull request before it can reach production:
# the backend must import cleanly and the frontend must type-check, lint and
# build.  The workflow is hermetic - placeholder credentials only, nothing here
# may touch a live project.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build check)
    runs-on: ubuntu-latest
    env:
      # Placeholders: settings are validated at import, and CI must never reach
      # a real Supabase project or provider.
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-real-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-not-a-real-key
      QWEN_API_KEY: ci-placeholder
      QWEN_BASE_URL: https://placeholder.maas.aliyuncs.com/compatible-mode/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import the application
        run: python -c "import app.main; print('app.main imported')"

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # The Supabase client is constructed at module scope, so `next build`
    # prerendering requires the URL/key to exist.  Placeholder values keep
    # the build hermetic - this artifact is never deployed, and the anon key
    # is browser-public by design, but the real project URL still does not
    # belong in a public repository.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-real-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

